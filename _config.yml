title: TheTeam
description: Multi-agent workspace for coordinated software delivery.
url: ""
baseurl: ""
repository_url: "https://github.com/TheTeamRepos/TheTeam"

markdown: kramdown
highlighter: rouge
permalink: pretty

sass:
  sass_dir: _sass
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - Makefile
  - README.md
  - vendor/
  - node_modules/
  - _site/

defaults:
  - scope:
      path: ""
    values:
      layout: default
