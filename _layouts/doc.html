---
layout: default
---

<section class="doc-shell">
  <div class="container-xl">
    <div class="doc-layout">
      <aside class="doc-sidebar" aria-label="Documentation navigation">
        <p class="doc-sidebar-title">Documentation</p>
        {% for item in site.data.docs %}
          {% assign item_url = item.url | relative_url %}
          <a href="{{ item_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </aside>
      <article class="doc-content">
        {{ content }}
      </article>
    </div>
  </div>
</section>
